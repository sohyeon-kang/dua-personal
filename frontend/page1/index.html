<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUA - 부산 여행 검색</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../shared.css">
    <script src="../shared.js" defer></script>
    <script src="main.js" defer></script>
</head>
<body>
    <main class="container">
        <div class="section-box">
            <div class="title-text">DUA</div>
            <div class="title-small-text">어디로든 떠나고 싶은 순간, 부산이 답합니다.</div>
        </div>
        <form id="search-form">
            <div class="section-box">
                <div class="region-select-wrapper">
                    <select class="region-select" id="region-select" aria-label="지역 선택" required>
                        <option value="" disabled selected>지역 선택</option>
                        <option value="수영구">광안리</option>
                        <option value="해운대구">해운대</option>
                        <option value="서면">서면</option>
                    </select>
                </div>
            </div>
            <div class="section-box filter-section">
                <div class="section-title" id="companion-label">동행 유형 선택</div>
                <div class="options-wrapper" id="companion-options" role="group" aria-labelledby="companion-label">
                    <button class="option-card" type="button" data-value="가족" aria-pressed="false"><span class="option-text">가족</span></button>
                    <button class="option-card" type="button" data-value="연인" aria-pressed="false"><span class="option-text">연인</span></button>
                    <button class="option-card" type="button" data-value="친구" aria-pressed="false"><span class="option-text">친구</span></button>
                </div>
            </div>
            <div class="section-box filter-section">
                <div class="section-title" id="weather-label">날씨 선택</div>
                <div class="options-wrapper" id="weather-options" role="group" aria-labelledby="weather-label">
                    <button class="option-card" type="button" data-value="맑음" aria-pressed="false"><span class="option-text">맑음</span></button>
                    <button class="option-card" type="button" data-value="비" aria-pressed="false"><span class="option-text">비</span></button>
                    <button class="option-card" type="button" data-value="폭염" aria-pressed="false"><span class="option-text">폭염</span></button>
                </div>
            </div>
            <p id="search-message" class="status-message" role="alert"></p>
            <div class="search-container">
                <button class="search-btn" type="submit">검색 <span aria-hidden="true">🔍</span></button>
            </div>
        </form>
        <a id="saved-course-link" class="text-link" href="../page3/" hidden>선택한 코스 다시 보기</a>
    </main>
</body>
</html>
