<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUA 코스 지도</title>
    <style>
        html, body, #map { width: 100%; height: 100%; margin: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; background: #eef1e7; }
        #map-message { position: absolute; z-index: 10; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 18px; text-align: center; background: #eef1e7; color: #64716a; line-height: 1.7; font-size: 12px; }
        [hidden] { display: none !important; }
        a, button { color: #03695e; font: inherit; }
        a { min-height: 36px; display: inline-flex; align-items: center; }
        button { margin-top: 8px; border: 1px solid #c9daf6; border-radius: 8px; min-height: 40px; padding: 8px 14px; background: white; cursor: pointer; }
        .info-window { padding: 10px; font-size: 13px; line-height: 1.5; min-width: 160px; max-width: 260px; }
        .info-title { font-weight: bold; color: #03695e; }
    </style>
    <script src="shared.js" defer></script>
    <script src="map.js" defer></script>
</head>
<body>
    <div id="map" aria-label="추천 장소와 코스 경로"></div>
    <div id="map-message" role="status">
        <p id="map-status">지도를 불러오는 중입니다.</p>
        <a id="external-map" target="_blank" rel="noopener noreferrer" hidden>카카오맵에서 선택한 코스 보기</a>
        <button id="retry-map" type="button" hidden>지도 다시 불러오기</button>
    </div>
</body>
</html>
